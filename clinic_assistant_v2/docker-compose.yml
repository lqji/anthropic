version: "3.8"

networks:
  clinic-net:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinic-qdrant
    ports:
      - "6333:6333"
    networks:
      - clinic-net

  appointments-mcp:
    build:
      context: .
      dockerfile: services/appointments/Dockerfile
    container_name: clinic-appointments-mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - HOST=0.0.0.0
    networks:
      - clinic-net

  pharmacy-mcp:
    build:
      context: .
      dockerfile: services/pharmacy/Dockerfile
    container_name: clinic-pharmacy-mcp
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - PORT=8002
      - HOST=0.0.0.0
    networks:
      - clinic-net

  records-mcp:
    build:
      context: .
      dockerfile: services/records/Dockerfile
    container_name: clinic-records-mcp
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - PORT=8003
      - HOST=0.0.0.0
    networks:
      - clinic-net

  knowledge-mcp:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: clinic-knowledge-mcp
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - PORT=8004
      - HOST=0.0.0.0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - clinic-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: clinic-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      - appointments-mcp
      - pharmacy-mcp
      - records-mcp
      - knowledge-mcp
    networks:
      - clinic-net
